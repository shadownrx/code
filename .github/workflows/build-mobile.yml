name: Build Mobile (Android + iOS)

# Reusable workflow: any repo can call this with a one-line `uses:` to get
# Android + iOS builds, without owning a Mac, entirely on GitHub's free
# hosted runners (macos-latest handles the iOS build in the cloud).
#
# See docs/USAGE.md for how a team wires this into their own repository.

on:
  workflow_call:
    inputs:
      project_type:
        description: "auto | flutter | react-native"
        type: string
        required: false
        default: "auto"
      build_android:
        type: boolean
        required: false
        default: true
      build_ios:
        type: boolean
        required: false
        default: true
      working_directory:
        description: "Path to the project root, for monorepos"
        type: string
        required: false
        default: "."
      flutter_channel:
        type: string
        required: false
        default: "stable"
      node_version:
        type: string
        required: false
        default: "20"
      create_release:
        description: "Attach build artifacts to a GitHub Release when the workflow runs on a tag push"
        type: boolean
        required: false
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      IOS_CERTIFICATE_BASE64:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_PROVISION_PROFILE_BASE64:
        required: false
      IOS_TEAM_ID:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      project_type: ${{ steps.pick.outputs.project_type }}
    steps:
      - uses: actions/checkout@v4
      - id: auto
        if: inputs.project_type == 'auto'
        uses: ./.github/actions/detect-project
        with:
          working-directory: ${{ inputs.working_directory }}
      - id: pick
        shell: bash
        run: |
          if [ "${{ inputs.project_type }}" = "auto" ]; then
            echo "project_type=${{ steps.auto.outputs.project_type }}" >> "$GITHUB_OUTPUT"
          else
            echo "project_type=${{ inputs.project_type }}" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    needs: detect
    if: inputs.build_android && needs.detect.outputs.project_type != 'unknown'
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode Android signing keystore (optional)
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystore/release.jks
          cat > android/key.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # --- Flutter ---
      - uses: subosito/flutter-action@v2
        if: needs.detect.outputs.project_type == 'flutter'
        with:
          channel: ${{ inputs.flutter_channel }}
          cache: true

      - name: flutter pub get
        if: needs.detect.outputs.project_type == 'flutter'
        working-directory: ${{ inputs.working_directory }}
        run: flutter pub get

      - name: flutter build apk + appbundle
        if: needs.detect.outputs.project_type == 'flutter'
        working-directory: ${{ inputs.working_directory }}
        run: |
          flutter build apk --release
          flutter build appbundle --release

      # --- React Native ---
      - uses: actions/setup-node@v4
        if: needs.detect.outputs.project_type == 'react-native'
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: npm ci
        if: needs.detect.outputs.project_type == 'react-native'
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      - name: gradlew assembleRelease + bundleRelease
        if: needs.detect.outputs.project_type == 'react-native'
        working-directory: ${{ inputs.working_directory }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Collect Android artifacts
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p android-artifacts
          find . -name "*.apk" -not -path "*/intermediates/*" -exec cp {} android-artifacts/ \;
          find . -name "*.aab" -not -path "*/intermediates/*" -exec cp {} android-artifacts/ \;
          ls -la android-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: ${{ inputs.working_directory }}/android-artifacts/*
          if-no-files-found: warn

  build-ios:
    needs: detect
    if: inputs.build_ios && needs.detect.outputs.project_type != 'unknown'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine if iOS signing secrets are present
        id: signing
        run: echo "enabled=${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_PROVISION_PROFILE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate & provisioning profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain

          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Generate ExportOptions.plist for signed export
        if: steps.signing.outputs.enabled == 'true'
        run: |
          cat > "${{ inputs.working_directory }}/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      # --- Flutter ---
      - uses: subosito/flutter-action@v2
        if: needs.detect.outputs.project_type == 'flutter'
        with:
          channel: ${{ inputs.flutter_channel }}
          cache: true

      - name: flutter pub get
        if: needs.detect.outputs.project_type == 'flutter'
        working-directory: ${{ inputs.working_directory }}
        run: flutter pub get

      - name: flutter build ipa (signed)
        if: needs.detect.outputs.project_type == 'flutter' && steps.signing.outputs.enabled == 'true'
        working-directory: ${{ inputs.working_directory }}
        run: |
          flutter build ipa --release \
            --export-options-plist=ExportOptions.plist

      - name: flutter build ios (unsigned, no Apple Developer account required)
        if: needs.detect.outputs.project_type == 'flutter' && steps.signing.outputs.enabled != 'true'
        working-directory: ${{ inputs.working_directory }}
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios-unsigned
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios-unsigned/Runner-unsigned.zip

      # --- React Native ---
      - uses: actions/setup-node@v4
        if: needs.detect.outputs.project_type == 'react-native'
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: npm ci
        if: needs.detect.outputs.project_type == 'react-native'
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      - name: pod install
        if: needs.detect.outputs.project_type == 'react-native'
        working-directory: ${{ inputs.working_directory }}/ios
        run: pod install

      - name: xcodebuild archive (signed)
        if: needs.detect.outputs.project_type == 'react-native' && steps.signing.outputs.enabled == 'true'
        working-directory: ${{ inputs.working_directory }}/ios
        run: |
          SCHEME=$(xcodebuild -list -json | node -e "const d=JSON.parse(require('fs').readFileSync(0));console.log(d.project.schemes[0]||d.workspace.schemes[0])")
          xcodebuild -workspace *.xcworkspace -scheme "$SCHEME" -sdk iphoneos -configuration Release \
            -archivePath build/App.xcarchive archive
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ../ExportOptions.plist -exportPath build/ipa

      - name: xcodebuild archive (unsigned, no Apple Developer account required)
        if: needs.detect.outputs.project_type == 'react-native' && steps.signing.outputs.enabled != 'true'
        working-directory: ${{ inputs.working_directory }}/ios
        run: |
          SCHEME=$(xcodebuild -list -json | node -e "const d=JSON.parse(require('fs').readFileSync(0));console.log(d.project.schemes[0]||d.workspace.schemes[0])")
          xcodebuild -workspace *.xcworkspace -scheme "$SCHEME" -sdk iphonesimulator -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          mkdir -p build/ios-unsigned
          ditto -c -k --sequesterRsrc --keepParent "build/Build/Products/Release-iphonesimulator/$SCHEME.app" build/ios-unsigned/App-unsigned.zip

      - name: Collect iOS artifacts
        working-directory: ${{ inputs.working_directory }}
        run: |
          mkdir -p ios-artifacts
          find . \( -name "*.ipa" -o -name "*-unsigned.zip" \) -exec cp {} ios-artifacts/ \;
          ls -la ios-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ${{ inputs.working_directory }}/ios-artifacts/*
          if-no-files-found: warn

  notify:
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result != 'skipped' || needs.build-ios.result != 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write job summary
        run: |
          {
            echo "## 📱 Resultado de compilación"
            echo ""
            echo "| Plataforma | Estado |"
            echo "|---|---|"
            echo "| Android | ${{ needs.build-android.result || 'skipped' }} |"
            echo "| iOS | ${{ needs.build-ios.result || 'skipped' }} |"
            echo ""
            echo "Artefactos disponibles en la pestaña **Artifacts** de esta ejecución:"
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack (optional)
        if: env.HAS_SLACK_WEBHOOK == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Build ${{ github.repository }}@${{ github.ref_name }}: Android=${{ needs.build-android.result || 'skipped' }} iOS=${{ needs.build-ios.result || 'skipped' }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Attach artifacts to GitHub Release (optional, tags only)
        if: inputs.create_release && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          fail_on_unmatched_files: false
